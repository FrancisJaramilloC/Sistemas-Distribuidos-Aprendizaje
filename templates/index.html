<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sincronización Concurrente</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 40px; 
            background: #fdfdfd;
            color: #333;
        }
        .container { 
            max-width: 800px; 
            margin: auto; 
        }
        .buttons { 
            margin-bottom: 20px; 
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button { 
            padding: 10px 15px; 
            cursor: pointer; 
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
        }
        button:hover {
            background: #cbd5e1;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        pre { 
            background: #1e1e1e; 
            color: #4ade80;
            padding: 20px; 
            border: 1px solid #000; 
            border-radius: 4px;
            min-height: 300px; 
            max-height: 500px;
            overflow-y: auto; 
            font-family: Consolas, monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simulador de Ejercicios</h1>
        <p>Selecciona un ejercicio para ejecutarlo y ver su salida en pantalla en tiempo real (como en la terminal).</p>
        
        <div class="buttons" id="btn-container">
            <button onclick="run(1)">Ejercicio 1 (Mutex)</button>
            <button onclick="run(2)">Ejercicio 2 (Semáforos)</button>
            <button onclick="run(3)">Ejercicio 3 (Prod-Cons)</button>
            <button onclick="run(4)">Ejercicio 4 (Lectores-Esc.)</button>
            <button onclick="run(5)">Ejercicio 5 (Barrera)</button>
        </div>
        
        <pre id="output">Esperando ejecución...</pre>
    </div>

    <script>
        let eventSource = null;

        function run(id) {
            const out = document.getElementById('output');
            const btns = document.querySelectorAll('button');
            
            // Si había un proceso corriendo, cerrarlo
            if (eventSource) {
                eventSource.close();
            }

            btns.forEach(b => b.disabled = true);
            out.innerText = `> Ejecutando python ejercicio${id}...\n\n`;

            // Server-Sent Events (SSE) para stream en tiempo real
            eventSource = new EventSource(`/stream/${id}`);

            eventSource.onmessage = function(event) {
                if (event.data === "[FIN_EJECUCION]") {
                    eventSource.close();
                    btns.forEach(b => b.disabled = false);
                } else {
                    out.innerText += event.data + '\n';
                    out.scrollTop = out.scrollHeight; // Auto-scroll hacia abajo
                }
            };

            eventSource.onerror = function() {
                out.innerText += '\n[Fin del flujo de la terminal]';
                eventSource.close();
                btns.forEach(b => b.disabled = false);
            };
        }
    </script>
</body>
</html>
